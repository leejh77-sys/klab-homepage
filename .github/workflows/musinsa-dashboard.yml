name: Musinsa Dashboard Data Update

on:
  schedule:
    # 매일 07:00 / 13:00 / 19:00 KST == 매일 22:00(전날) / 04:00 / 10:00 UTC
    - cron: "0 22 * * *"
    - cron: "0 4 * * *"
    - cron: "0 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run crawler
        run: python scripts/crawl_musinsa.py

      - name: Commit and push if data changed
        run: |
          git config user.name "musinsa-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: update musinsa dashboard data ($(date -u +%Y-%m-%d))"
            git push
          fi
