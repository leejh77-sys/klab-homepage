name: Build Reports

on:
  push:
    branches: [main]
    paths:
      - "reports/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install LibreOffice and Korean fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice fonts-nanum fonts-noto-cjk
          fc-cache -f

      - name: Convert reports and build manifest
        run: python scripts/build_reports.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "klab-reports-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/ data/reports.json
          if git diff --cached --quiet; then
            echo "No report changes."
          else
            git commit -m "chore: publish reports ($(date -u +%Y-%m-%d))"
            git push
          fi
